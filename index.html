<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>דמו – ענת בלייר שיקום ביתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--ink:#1d2433;--mute:#6b7385;--card:rgba(255,255,255,.72);--line:rgba(30,40,70,.09);--teal:#14b8a6;--indigo:#6366f1;--violet:#a855f7;--amber:#f59e0b;--rose:#f43f5e;--green:#10b981;--grad:linear-gradient(120deg,#14b8a6,#6366f1 55%,#a855f7)}
body.dark{--bg:#0a0f1e;--ink:#e7ebf5;--mute:#94a0b8;--card:rgba(22,30,54,.72);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Heebo,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;transition:background .4s,color .4s;min-height:100vh}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;animation:float 22s ease-in-out infinite alternate}
body:before{width:620px;height:620px;top:-220px;right:-120px;background:radial-gradient(circle,#5eead4,transparent 65%)}
body:after{width:560px;height:560px;bottom:-240px;left:-140px;background:radial-gradient(circle,#c4b5fd,transparent 65%);animation-delay:-8s}
body.dark:before{opacity:.25}body.dark:after{opacity:.3}
@keyframes float{to{transform:translate(60px,40px) scale(1.12)}}
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.brand b{font-size:17px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{display:block;color:var(--mute);font-size:11.5px}
.clock{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:13px}
.clock button,.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12.5px;transition:.2s}.clock button:hover,.ghost:hover{background:var(--grad);color:#fff;border-color:transparent}

.wrap{display:flex;gap:16px;padding:6px 18px 18px;align-items:flex-start}main{flex:1;min-width:0}
main>*{animation:rise .5s both}main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(30,40,70,.06)}
h2{font-size:18px;font-weight:700;margin:2px 0 12px}h3{font-size:15px;font-weight:700;margin:14px 0 6px;color:var(--indigo)}.hint{color:var(--mute);font-size:12.5px;margin-bottom:10px}

.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.g{background:rgba(16,185,129,.12);color:#059669;border-color:rgba(16,185,129,.25)}.y,.st.b,.st.pu,.st.gr{background:rgba(245,158,11,.12);color:#b45309;border-color:rgba(245,158,11,.3)}.r{background:rgba(244,63,94,.12);color:#e11d48;border-color:rgba(244,63,94,.3)}
body.dark .g{color:#34d399}body.dark .y,body.dark .b,body.dark .pu,body.dark .gr{color:#fbbf24}body.dark .r{color:#fb7185}
.btn{padding:7px 13px;border:0;border-radius:999px;background:var(--grad);background-size:160% 160%;color:#fff;cursor:pointer;font-family:inherit;font-size:13px;margin:2px;box-shadow:0 6px 16px rgba(99,102,241,.28);transition:.25s}.btn:hover{background-position:100% 0;transform:translateY(-1px)}
.btn.alt{background:transparent;color:var(--indigo);border:1px solid rgba(99,102,241,.4);box-shadow:none}.btn.red{background:linear-gradient(120deg,#f43f5e,#f97316)}.btn.sm{padding:4px 10px;font-size:12px}

.k1{background:linear-gradient(135deg,#1e3a8a,#6366f1 60%,#22d3ee)}.k2{background:linear-gradient(135deg,#0f766e,#14b8a6 55%,#5eead4)}.k3{background:linear-gradient(135deg,#9f1239,#f43f5e 55%,#fb923c)}.k4{background:linear-gradient(135deg,#4c1d95,#a855f7 55%,#f0abfc)}.k5{background:linear-gradient(135deg,#7c2d12,#f59e0b 60%,#fde68a)}.k6{background:linear-gradient(135deg,#064e3b,#10b981 55%,#a7f3d0)}
.alert{padding:9px 12px;border-radius:12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card)}
.alert.red{border-right:3px solid var(--rose)}.alert.yellow{border-right:3px solid var(--amber)}
.alert.red span:first-child:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-left:6px;box-shadow:0 0 0 0 rgba(244,63,94,.6);animation:ping 1.6s infinite}

.save{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;padding:22px}.hero h2{font-size:22px;font-weight:800}.hero .grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.flow{width:100%;height:150px;display:block}
.phone{background:linear-gradient(180deg,rgba(99,102,241,.06),rgba(20,184,166,.06));border:1px solid var(--line);border-radius:22px;padding:12px;max-height:470px;overflow:auto}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:9px 12px;margin:7px 0;max-width:92%;white-space:pre-wrap;line-height:1.5;box-shadow:0 4px 12px rgba(30,40,70,.05)}.bub.me{background:linear-gradient(120deg,rgba(20,184,166,.18),rgba(99,102,241,.18));margin-right:auto;border-radius:16px 16px 16px 4px}.bub small{display:block;color:var(--mute);font-size:11px;margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
textarea,input,select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none;transition:.2s}textarea:focus,input:focus,select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.15)}textarea{width:100%;min-height:96px}
.cal-scroll{overflow-x:auto}.cal{min-width:620px;display:grid;gap:4px;font-size:12px}.cal div{background:var(--card);border:1px solid var(--line);padding:5px;border-radius:10px;min-height:34px}.cal .h{background:var(--grad);color:#fff;text-align:center;border:0}
.ev{display:block;margin:2px 0;padding:3px 6px;border-radius:8px;background:rgba(16,185,129,.14);border-right:3px solid var(--green)}.ev.warn{background:rgba(244,63,94,.13);border-right-color:var(--rose)}.ev.nc{background:rgba(245,158,11,.14);border-right-color:var(--amber)}
.tl{font-size:12px;color:var(--mute);border-right:2px solid rgba(99,102,241,.35);padding-right:10px;margin:4px 0}.muted{color:var(--mute)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.bars{display:flex;gap:22px;align-items:flex-end;height:150px;padding:8px 6px 0}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}.bar i{display:block;width:100%;max-width:70px;border-radius:12px 12px 4px 4px;background:var(--grad);box-shadow:0 10px 24px rgba(99,102,241,.3);transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}.bar b{color:var(--ink)}
.money-head{border:1px solid rgba(99,102,241,.16);border-radius:18px;padding:14px;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(20,184,166,.07));margin:14px 0}.money-head .grid{grid-template-columns:repeat(3,minmax(160px,1fr))}.money-table{overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.22)}.money-table table{min-width:760px}.money-table tr:last-child td{background:rgba(99,102,241,.08);border-bottom:0}.publish-bubble{margin-top:18px;padding:16px 18px;border:1px solid rgba(99,102,241,.18);border-radius:22px;background:#fff;color:#1d2433;box-shadow:0 12px 30px rgba(30,40,70,.1)}.publish-bubble-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;margin-bottom:8px}.publish-bubble label{display:inline-flex;align-items:center;gap:5px;margin:6px 0 6px 14px}.publish-bubble .hint{margin:8px 0 0}
.lead-page-title{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px}.lead-detail-layout{display:grid;grid-template-columns:minmax(300px,1.08fr) minmax(300px,.92fr);gap:18px;align-items:start;margin-top:16px}.lead-full-card{color:#1d2433;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;border:2px solid transparent;border-radius:24px;padding:20px;box-shadow:0 18px 42px rgba(30,40,70,.14);min-height:100%}.lead-full-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.lead-full-icon{width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;font-size:23px;color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(99,102,241,.3)}.lead-full-head h2{font-size:22px;font-weight:800;margin:0}.lead-full-head small{display:block;color:#6b7385;margin-top:2px}.lead-full-message{background:#f8fafc;border:1px solid #e7eaf1;border-radius:18px 18px 5px 18px;padding:14px 16px;white-space:pre-wrap;line-height:1.65;box-shadow:0 5px 16px rgba(30,40,70,.06);margin-bottom:14px}.lead-meta{display:grid;gap:8px}.lead-meta-row{display:flex;justify-content:space-between;gap:14px;padding:8px 2px;border-bottom:1px solid #edf0f5}.lead-meta-row:last-child{border-bottom:0}.lead-meta-row span{color:#6b7385}.lead-patient-panel{min-width:0}.lead-section-title{font-size:20px;font-weight:800;margin:0 0 10px}.lead-info-grid{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px}.lead-info-tile{aspect-ratio:1/1;min-height:112px;background:#fff;color:#1d2433;border:1px solid rgba(99,102,241,.16);border-radius:18px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(30,40,70,.08)}.lead-info-tile>span{font-size:12px;font-weight:700;color:#6b7385}.lead-info-tile input,.lead-info-tile select{width:100%;padding:7px 0;border:0;border-bottom:2px solid rgba(99,102,241,.18);border-radius:0;background:transparent;color:#1d2433;font-size:16px;font-weight:700}.lead-info-tile input:focus,.lead-info-tile select:focus{box-shadow:none;border-color:var(--indigo)}.lead-save{margin-top:12px}
.groups-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:16px}.group-card{background:#fff;color:#1d2433;border:1px solid rgba(99,102,241,.16);border-radius:24px;padding:18px;box-shadow:0 14px 34px rgba(30,40,70,.1);min-width:0}.group-card-title{font-size:23px;font-weight:800;margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid rgba(99,102,241,.14);display:flex;align-items:center;gap:8px}.group-card .phone{min-height:330px}
.group-new-label{display:inline-flex;align-items:center;background:linear-gradient(120deg,#7c3aed,#a855f7);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;margin-bottom:7px;box-shadow:0 6px 16px rgba(124,58,237,.25)}.group-daily{margin-top:14px;padding-top:14px;border-top:2px solid rgba(99,102,241,.1)}.group-daily h3{font-size:17px;color:#1d2433;margin:0 0 8px}.group-daily-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 10px;margin:6px 0;border-radius:13px;background:#f7f6ff;border:1px solid #ebe8ff}.portal-stack{display:grid;gap:16px}.portal-section{background:#fff;color:#1d2433;border:1px solid rgba(99,102,241,.14);border-radius:22px;padding:17px;box-shadow:0 10px 28px rgba(30,40,70,.08)}.portal-section h2,.portal-section h3{margin-top:0}.lead-mini{border:1px solid #e8eaf3;border-radius:17px;padding:13px;margin:9px 0;background:#fafbff}.lead-mini-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.lead-mini-name{font-size:16px;font-weight:800}.system-reminder{border-right:4px solid var(--indigo);background:#f7f6ff;border-radius:13px;padding:10px 12px;margin:7px 0}.journey-badge{font-weight:700}.portal-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.team-summary{margin-bottom:16px}.money-flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}.money-flow span{padding:6px 10px;border-radius:999px;background:#f3f4f8;border:1px solid #e5e7ef;font-size:12px;font-weight:700}.money-flow b{color:var(--indigo)}
.portal-main-title{font-size:30px;font-weight:800;margin:0 0 16px}.physio-identity{margin-top:18px;padding:15px 18px;border:1px solid rgba(99,102,241,.18);border-radius:20px;background:linear-gradient(120deg,rgba(99,102,241,.1),rgba(20,184,166,.08));box-shadow:0 8px 22px rgba(30,40,70,.06)}.physio-identity>span{display:block;color:var(--mute);font-size:12px;font-weight:700}.physio-identity-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}.physio-identity-main>b{font-size:24px;font-weight:800}.physio-identity-main select{min-width:170px;font-size:16px;font-weight:700}
.pending-documentation{border-right:5px solid var(--amber);margin-bottom:16px}.completed-treatments{border-right:5px solid var(--green);margin-bottom:16px}.treatment-progress{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.treatment-progress span{padding:6px 10px;border-radius:12px;background:#f7f8fc;border:1px solid #e7eaf2}.treatment-history{overflow:auto}.treatment-history table{min-width:620px}

.physio-home{max-width:1180px;margin:0 auto}.physio-flow-board{background:linear-gradient(135deg,#fff,rgba(255,255,255,.72));border:1px solid rgba(99,102,241,.16);border-radius:26px;padding:20px;box-shadow:0 16px 40px rgba(30,40,70,.09);overflow:hidden}.physio-flow-board-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.physio-flow-board h1{margin:0;font-size:29px}.physio-flow-board .physio-identity{margin:0;padding:10px 14px;min-width:270px}.therapist-process{display:grid;grid-template-columns:repeat(6,minmax(112px,1fr));gap:0;margin-top:20px;overflow-x:auto;padding:2px 4px 10px}.therapist-process-step{position:relative;min-width:112px;text-align:center;padding:0 10px}.therapist-process-step:not(:last-child):after{content:"";position:absolute;top:21px;left:-50%;width:100%;height:3px;background:linear-gradient(90deg,#14b8a6,#6366f1);opacity:.45}.therapist-process-num{position:relative;z-index:2;width:46px;height:46px;margin:0 auto 9px;border-radius:16px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:18px;font-weight:800;box-shadow:0 8px 20px rgba(99,102,241,.25)}.therapist-process-step b{display:block;font-size:13px}.therapist-process-step small{display:block;color:var(--mute);font-size:11px;margin-top:2px}.physio-priority{margin:18px 0;background:linear-gradient(125deg,#0f766e,#14b8a6 45%,#6366f1);color:#fff;border-radius:26px;padding:21px;box-shadow:0 18px 38px rgba(20,184,166,.25)}.physio-priority h2{font-size:22px;margin:0 0 5px}.physio-priority .hint{color:rgba(255,255,255,.82)}.physio-priority .lead-mini{background:#fff;color:#1d2433;border:0}.physio-priority .physio-empty{color:#fff;border-color:rgba(255,255,255,.45)}.physio-menu-title{font-size:25px;font-weight:800;margin:24px 0 12px}.physio-tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.physio-tile{appearance:none;width:100%;aspect-ratio:1.18/1;border:1px solid rgba(30,40,70,.11);border-radius:24px;backgro
